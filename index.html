<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichaje UAM</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F6F1F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fichaje">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
  :root { --noche:#2E073E; --morado:#472468; --lavanda:#CDB6D8; --niebla:#F6F1F8; --oro:#C9A15E; --oro-fosc:#8A6630; --borde:#E4D9EA; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--niebla); color:var(--noche); font-family:Archivo, system-ui, sans-serif; }
  main { width:100%; max-width:420px; margin:0 auto; padding:20px 16px 32px; }
  header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  header img { width:52px; height:52px; border-radius:50%; background:#fff; flex:none; }
  .marca { font-size:11px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--oro-fosc); }
  h1 { margin:2px 0 0; font:600 22px/1.15 Fraunces, Georgia, serif; overflow-wrap:anywhere; }
  .reloj { text-align:center; margin:8px 0 18px; }
  .hora { font:600 56px/1 Fraunces, Georgia, serif; font-variant-numeric:tabular-nums; }
  .fecha { margin-top:6px; font-size:15px; }
  .fecha::first-letter { text-transform:uppercase; }
  .wifi { display:flex; align-items:center; justify-content:center; gap:8px; min-height:40px; padding:8px 12px; margin-bottom:16px; border-radius:10px; font-size:14px; font-weight:500; background:#fff; border:1px solid var(--borde); }
  .wifi::before { content:""; width:9px; height:9px; border-radius:50%; background:var(--lavanda); flex:none; }
  .wifi.si::before { background:#2F7D4F; }
  .wifi.no { background:var(--noche); color:var(--niebla); border-color:var(--noche); }
  .wifi.no::before { background:var(--oro); }
  button { width:100%; min-height:76px; border:0; border-radius:14px; color:#fff; background:var(--morado); font:600 22px Archivo, system-ui, sans-serif; cursor:pointer; touch-action:manipulation; transition:transform .12s ease, opacity .15s ease; }
  button.salida { background:var(--oro-fosc); }
  button.secundario { min-height:48px; margin-top:8px; font-size:16px; background:#fff; color:var(--morado); border:1px solid var(--morado); }
  button:active:not(:disabled) { transform:scale(.98); }
  button:disabled { opacity:.45; cursor:default; }
  button:focus-visible { outline:3px solid var(--oro); outline-offset:2px; }
  .aviso { min-height:22px; margin:12px 0 0; text-align:center; font-size:15px; font-weight:500; }
  section { margin-top:24px; }
  h2 { margin:0 0 8px; font:600 17px Fraunces, Georgia, serif; }
  ul { list-style:none; margin:0; padding:0 12px; background:#fff; border:1px solid var(--borde); border-radius:10px; }
  li { display:flex; justify-content:space-between; gap:12px; padding:10px 0; font-size:15px; font-variant-numeric:tabular-nums; border-bottom:1px solid var(--niebla); }
  li:last-child { border-bottom:0; }
  li b { font-weight:600; }
  .vacio { color:#6B5578; }
  .ficha { padding:16px; background:#fff; border:1px solid var(--borde); border-radius:10px; font-size:15px; line-height:1.6; overflow-wrap:anywhere; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <img alt="Logo de la Escola de Música" src="icon-180.png">
    <div>
      <div class="marca">Registro de jornada</div>
      <h1 id="titulo">Cargando…</h1>
    </div>
  </header>

  <div id="vistaProfe" hidden>
    <div class="reloj">
      <div class="hora" id="hora">--:--</div>
      <div class="fecha" id="fecha"></div>
    </div>
    <div class="wifi" id="wifi" role="status">Comprobando la wifi…</div>
    <button id="boton" disabled>…</button>
    <button id="reintentar" class="secundario" hidden>Volver a comprobar la wifi</button>
    <p class="aviso" id="aviso" role="alert"></p>
    <section>
      <h2>Mis últimos fichajes</h2>
      <ul id="lista"></ul>
    </section>
  </div>

  <div id="vistaAdmin" hidden>
    <div class="ficha">
      <div>IP guardada: <b id="ipGuardada">—</b></div>
      <div>Esta conexión: <b id="ipActual">—</b></div>
    </div>
    <p class="aviso" id="avisoAdmin" role="alert"></p>
    <button id="botonIp" disabled>Usar esta conexión como wifi del centro</button>
  </div>

  <p class="aviso" id="error" role="alert" hidden></p>
</main>

<script>
  const API = "https://script.google.com/macros/s/AKfycbzhBwfsQEPv4w3DUkw1KgOBvA6cEilyxogOiIQ42c6szzTuTec00SdKP_eecrsmMpaD/exec";
  const enlace = new URLSearchParams(location.hash.slice(1));
  const admin = enlace.get("admin") || "";
  const token = leerToken(enlace.get("t"));

  function leerToken(delEnlace) {
    try {
      if (delEnlace) localStorage.setItem("fichaje_token", delEnlace);
      return delEnlace || localStorage.getItem("fichaje_token") || "";
    } catch (e) {
      return delEnlace || "";
    }
  }

  const $ = id => document.getElementById(id);
  let siguiente = null;
  let ip = '';
  let ocupado = false;

  async function llamar(fn, ...args) {
    const r = await fetch(API, {
      method: "POST",
      credentials: "omit",
      redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ fn, args })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  const SERVICIOS_IP = ["https://api.ipify.org?format=json", "https://ipv4.icanhazip.com/", "https://checkip.amazonaws.com/"];

  async function leerIp() {
    for (const url of SERVICIOS_IP) {
      const control = new AbortController();
      const espera = setTimeout(() => control.abort(), 4000);
      try {
        const r = await fetch(url, { signal: control.signal, cache: "no-store", credentials: "omit" });
        const m = (await r.text()).match(/\b\d{1,3}(?:\.\d{1,3}){3}\b/);
        if (r.ok && m) return m[0];
      } catch (e) {
        // Si un servicio está bloqueado, se prueba el siguiente.
      } finally {
        clearTimeout(espera);
      }
    }
    return "";
  }

  function reloj() {
    const d = new Date();
    $('hora').textContent = d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/Madrid' });
    $('fecha').textContent = d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long', timeZone:'Europe/Madrid' });
  }

  function pintarWifi(enCentro) {
    $('wifi').className = 'wifi ' + (enCentro ? 'si' : 'no');
    $('wifi').textContent = enCentro ? 'Conectado a la wifi del centro' : 'Conéctate a la wifi del centro para fichar';
    $('reintentar').hidden = enCentro;
    return enCentro;
  }

  function pintar(d) {
    $('titulo').textContent = d.nombre;
    siguiente = d.siguiente;
    $('boton').textContent = 'Fichar ' + siguiente.toLowerCase();
    $('boton').className = siguiente === 'Salida' ? 'salida' : '';
    $('lista').replaceChildren(...(d.ultimos.length ? d.ultimos.map(r => {
      const li = document.createElement('li');
      const a = document.createElement('span');
      const b = document.createElement('b');
      a.textContent = r.dia + ' · ' + r.hora;
      b.textContent = r.tipo;
      li.append(a, b);
      return li;
    }) : [Object.assign(document.createElement('li'), { className:'vacio', textContent:'Todavía no hay fichajes' })]));
  }

  function fallo(texto) {
    $('titulo').textContent = 'Fichaje';
    $('vistaProfe').hidden = true;
    $('vistaAdmin').hidden = true;
    $('error').hidden = false;
    $('error').textContent = texto;
  }

  async function cargarProfe() {
    $('boton').disabled = true;
    $('wifi').className = 'wifi';
    $('wifi').textContent = 'Comprobando la wifi…';
    ip = await leerIp();
    try {
      const d = await llamar('obtenerEstado', token, ip);
      if (!d.ok) return fallo(d.mensaje);
      $('vistaProfe').hidden = false;
      pintar(d);
      $('boton').disabled = !pintarWifi(d.enCentro);
    } catch (e) {
      fallo('No se ha podido conectar. Comprueba internet y vuelve a abrir la app.');
    }
  }

  async function pulsarFichar() {
    if (ocupado) return;
    ocupado = true;
    $('boton').disabled = true;
    $('aviso').textContent = 'Registrando…';
    try {
      ip = await leerIp();
      const d = await llamar('fichar', token, siguiente, ip);
      if (d.nombre) pintar(d);
      if (d.fueraCentro) pintarWifi(false);
      $('aviso').textContent = d.ok ? d.tipo + ' registrada a las ' + d.hora : d.mensaje;
      $('boton').disabled = !!d.fueraCentro;
    } catch (e) {
      $('aviso').textContent = 'No se ha registrado. Inténtalo de nuevo.';
      $('boton').disabled = false;
    } finally {
      ocupado = false;
    }
  }

  function pintarAdmin(d) {
    $('ipGuardada').textContent = d.ipCentro || 'sin configurar';
    $('ipActual').textContent = d.ipActual || 'no detectada';
    $('avisoAdmin').textContent = d.coincide ? 'Esta conexión ya es la wifi del centro.' : 'Pulsa solo si estás conectado a la wifi del centro.';
    $('botonIp').disabled = !d.ipActual || d.coincide;
  }

  async function cargarAdmin() {
    ip = await leerIp();
    try {
      const d = await llamar('estadoAdmin', admin, ip);
      if (!d.ok) return fallo(d.mensaje);
      $('titulo').textContent = 'Wifi del centro';
      $('vistaAdmin').hidden = false;
      pintarAdmin(d);
    } catch (e) {
      fallo('No se ha podido conectar. Vuelve a abrir la página.');
    }
  }

  $('boton').addEventListener('click', pulsarFichar);
  $('reintentar').addEventListener('click', cargarProfe);
  $('botonIp').addEventListener('click', async () => {
    $('botonIp').disabled = true;
    try {
      const d = await llamar('actualizarIp', admin, ip);
      if (!d.ok) return fallo(d.mensaje);
      pintarAdmin(d);
      $('avisoAdmin').textContent = 'Wifi del centro actualizada.';
    } catch (e) {
      $('avisoAdmin').textContent = 'No se ha guardado. Inténtalo de nuevo.';
      $('botonIp').disabled = false;
    }
  });

  if (admin) {
    cargarAdmin();
  } else if (token) {
    reloj();
    setInterval(reloj, 15000);
    cargarProfe();
  } else {
    fallo('Abre la app desde tu enlace personal.');
  }
</script>
</body>
</html>
